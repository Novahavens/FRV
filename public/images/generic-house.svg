<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Roof -->
  <polygon points="100,20 180,100 120,100" fill="#c9a875" />
  <polygon points="100,20 20,100 80,100" fill="#d4b896" />

  <!-- Main house body -->
  <rect x="30" y="100" width="140" height="130" fill="#e8dcc8" />

  <!-- Door -->
  <rect x="85" y="160" width="30" height="70" fill="#8b6f47" />
  <circle cx="113" cy="195" r="2" fill="#d4af37" />

  <!-- Left window -->
  <rect x="45" y="115" width="25" height="25" fill="#87ceeb" />
  <line x1="57.5" y1="115" x2="57.5" y2="140" stroke="#87ceeb" stroke-width="0.5" />
  <line x1="45" y1="127.5" x2="70" y2="127.5" stroke="#87ceeb" stroke-width="0.5" />

  <!-- Right window -->
  <rect x="130" y="115" width="25" height="25" fill="#87ceeb" />
  <line x1="142.5" y1="115" x2="142.5" y2="140" stroke="#87ceeb" stroke-width="0.5" />
  <line x1="130" y1="127.5" x2="155" y2="127.5" stroke="#87ceeb" stroke-width="0.5" />

  <!-- Second floor windows -->
  <rect x="50" y="140" width="20" height="20" fill="#87ceeb" />
  <line x1="60" y1="140" x2="60" y2="160" stroke="#87ceeb" stroke-width="0.5" />
  <line x1="50" y1="150" x2="70" y2="150" stroke="#87ceeb" stroke-width="0.5" />

  <rect x="130" y="140" width="20" height="20" fill="#87ceeb" />
  <line x1="140" y1="140" x2="140" y2="160" stroke="#87ceeb" stroke-width="0.5" />
  <line x1="130" y1="150" x2="150" y2="150" stroke="#87ceeb" stroke-width="0.5" />
</svg>